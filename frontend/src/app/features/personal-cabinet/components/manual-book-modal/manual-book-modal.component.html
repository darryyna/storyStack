<div class="modal-container">
  <div class="modal-header">
    <h2>{{ 'MANUAL_ENTRY.TITLE' | translate }}</h2>
  </div>

  <div class="modal-body">
    <p class="subtitle">{{ 'MANUAL_ENTRY.SUBTITLE' | translate }}</p>

    <form [formGroup]="bookForm" class="manual-form">
      <div class="form-row">
        <div class="cover-upload-section">
          <label class="section-label">{{ 'MANUAL_ENTRY.UPLOAD_COVER' | translate }}</label>
          <div class="image-preview" (click)="fileInput.click()">
            <ng-container *ngIf="imagePreview(); else placeholderTmp">
              <img [src]="imagePreview()" alt="Preview">
            </ng-container>
            <ng-template #placeholderTmp>
              <div class="placeholder">
                <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
                <span>{{ 'MANUAL_ENTRY.UPLOAD_COVER' | translate }}</span>
              </div>
            </ng-template>
            <input type="file" #fileInput (change)="onFileSelected($event)" accept="image/*" hidden>
          </div>
          <p class="optional-hint">{{ 'MANUAL_ENTRY.OPTIONAL' | translate }}</p>
          <button *ngIf="selectedFile()" type="button" class="btn btn-warn btn-sm" (click)="onRemoveImage()">
            {{ 'MANUAL_ENTRY.REMOVE_COVER' | translate }}
          </button>
        </div>

        <div class="fields-section">
          <div class="form-group">
            <label class="form-label">{{ 'MANUAL_ENTRY.BOOK_TITLE' | translate }}</label>
            <input type="text" class="form-input" formControlName="title" [placeholder]="'TABLE.TITLE' | translate">
            <span class="form-error" *ngIf="bookForm.get('title')?.touched && bookForm.get('title')?.hasError('required')">
              {{ 'FORM_ERRORS.REQUIRED' | translate }}
            </span>
          </div>

          <div class="form-group">
            <label class="form-label">{{ 'MANUAL_ENTRY.AUTHORS' | translate }}</label>
            <input type="text" class="form-input" formControlName="authors" [placeholder]="'TABLE.AUTHOR' | translate">
            <span class="form-error" *ngIf="bookForm.get('authors')?.touched && bookForm.get('authors')?.hasError('required')">
              {{ 'FORM_ERRORS.REQUIRED' | translate }}
            </span>
          </div>
        </div>
      </div>

      <div class="form-group full-width">
        <label class="form-label">{{ 'MANUAL_ENTRY.DESCRIPTION' | translate }}</label>
        <textarea class="form-textarea" formControlName="description" rows="4"></textarea>
      </div>
    </form>
  </div>

  <div class="modal-footer">
    <button type="button" class="btn btn-secondary" (click)="onCancel()" [disabled]="isSaving()">
      {{ 'ACTIONS.CANCEL' | translate }}
    </button>
    <button type="button" class="btn btn-primary"
            [disabled]="bookForm.invalid || isSaving()"
            (click)="onSubmit()">
      <ng-container *ngIf="isSaving(); else normalBtnText">
        {{ 'MANUAL_ENTRY.SAVING' | translate }}
      </ng-container>
      <ng-template #normalBtnText>
        {{ 'ACTIONS.ADD' | translate }}
      </ng-template>
    </button>
  </div>
</div>
