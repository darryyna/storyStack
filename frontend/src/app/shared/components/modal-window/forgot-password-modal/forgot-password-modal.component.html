<div class="modal-container">
  <div class="modal-header">
    <h2>{{ 'AUTH.FORGOT_PASSWORD_TITLE' | translate }}</h2>
  </div>

  <div class="modal-body">
    @if (!submitted()) {
      <p>{{ 'AUTH.FORGOT_PASSWORD_DESC' | translate }}</p>
      <form [formGroup]="form">
        <div class="form-group">
          <input type="email" class="form-input" formControlName="email"
                 [class.invalid]="form.controls.email.invalid && form.controls.email.touched"
                 [placeholder]="'PLACEHOLDERS.FORM-EMAIL' | translate">

          <app-form-error [control]="form.controls.email" />
        </div>
      </form>
    } @else {
      <div class="success-container">
        <p>{{ 'AUTH.FORGOT_PASSWORD_SUCCESS' | translate }}</p>
      </div>
    }

    <app-form-error [serverError]="error()" />
  </div>

  <div class="modal-footer">
    @if (!submitted()) {
      <button class="btn btn-secondary" (click)="onCancel()">
        {{ 'ACTIONS.CANCEL' | translate }}
      </button>
      <button class="btn btn-primary"
              [disabled]="form.invalid || isLoading()"
              (click)="onSubmit()">
        {{ (isLoading() ? 'ACTIONS.LOADING' : 'ACTIONS.SEND') | translate }}
      </button>
    } @else {
      <button class="btn btn-primary" (click)="onCancel()">
        {{ 'ACTIONS.CLOSE' | translate }}
      </button>
    }
  </div>
</div>
