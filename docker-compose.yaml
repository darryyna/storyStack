services:
  mongo:
    image: mongo:7
    container_name: storyStack-mongo
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: storyStackDb
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:alpine
    container_name: storyStack-redis
    ports:
      - "6379:6379"

volumes:
  mongo_data: